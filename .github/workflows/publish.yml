name: Publish nersc-tokens
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'NERSC/iri-api-get-globus-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('python/pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match package version: v' + version)
          PY
      - run: python -m pip install ./python build twine
      - run: python -m unittest discover -s python/tests -v
      - run: python -m build python --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nersc-tokens
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
